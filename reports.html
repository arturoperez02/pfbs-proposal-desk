<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>PFBS Service Reports</title>
<link rel="icon" href="logo.jpg">

<style>
:root{--navy:#1F2A6B;--navy2:#2C3A8C;--gold:#C9A227;--bg:#F3F4F8;--card:#fff;--ink:#1d2333;--mut:#667085;--line:#E1E4EC;--ok:#1E8E5A;--warn:#B54708;--bad:#C0322B;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header .t{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
header button.gold{background:var(--gold);color:#1d1d1d}
main{max-width:760px;margin:0 auto;padding:14px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(44,58,140,.12)}
textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.checks label{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;margin:8px 0}
.checks input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy)}
.checks input[type=text]{margin-top:6px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .c{font-weight:700}
.item .a{color:var(--mut);font-size:14px;margin-top:2px}
.item .m{display:flex;gap:10px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.p{background:#FFF4E5;color:var(--warn)}
.chip.a{background:#E7F6EE;color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;padding:8px;font-size:14px}
.ph .row{display:flex;border-top:1px solid var(--line)}
.ph .row button{flex:1;border:0;background:#fff;padding:7px;font-size:13px;color:var(--mut)}
.ph .row button.del{color:var(--bad)}
.addph{border:2px dashed #c9cfdd;border-radius:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy2);font-weight:700;background:#fff;cursor:pointer}
.addph span{font-size:30px;line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6}
.bar .in{max-width:760px;width:100%;display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer}
.btn.sec{background:#EEF0F6;color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;flex:1}
.btn.gold{background:var(--gold);color:#1d1d1d}
.btn:disabled{opacity:.55}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status a{color:var(--navy2);font-weight:600}
.saved{font-size:12px;color:#cfd5ff}
.login{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
.login img{width:260px;max-width:80%;margin-bottom:22px}
.login .card{text-align:left}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1d2333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.overlay{position:fixed;inset:0;background:rgba(15,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.dialog{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px}
.dialog h3{margin:0 0 8px}
.dialog p{margin:6px 0;color:#444}
.dialog .warn{color:var(--warn);font-weight:600}
.dialog .acts{display:flex;gap:10px;margin-top:16px}
.dialog .acts .btn{flex:1}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.small{font-size:13px;color:var(--mut)}
.li{display:flex;flex-direction:column;gap:8px}
.lirow{display:flex;align-items:center;gap:8px}
.lirow .n{width:22px;text-align:right;color:var(--mut);font-weight:600;flex:none}
.lirow input{flex:1}
.lirow .x{flex:none;width:36px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--mut);cursor:pointer}
.addli{margin-top:10px;border:1px dashed #c9cfdd;background:#fff;color:var(--navy2);font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer;width:100%}
.editcrew{background:none;border:0;color:var(--navy2);font-weight:600;font-size:13px;padding:6px 0 0;cursor:pointer}
.card.prev{background:#EEF2FF;border-color:#C7D0F5;display:flex;flex-direction:column;gap:10px}
.prevacts{display:flex;gap:8px}.prevacts .btn{flex:1;padding:10px}
.btn.dup{padding:8px 12px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--bad);font-size:14px;padding:6px 0;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
let state = { prev: {}, techs: null, tab: 'pending', list: [], report: null, saveTimer: null, dirty: false, saving: null };

// ===== Report logic (moved from the old Cloudflare app; runs in the browser now) =====
const SRV = (() => {
const TZ_DEFAULT = 'America/Los_Angeles';
const DEFAULT_SUBJECT = 'Service Report from PF Building Services';
const DEFAULT_MESSAGE = 'Attached is the service report requested. Please take a look and let me know if you have any questions. Thank you very much for the opportunity.';
const DEFAULT_SIGNATURE = 'Oscar Perez\nPF Building Services\n(510) 359-5181 | info@pfbuildingservices.com\nwww.pfbservices.com';
function newReport(d, env) {
  const tz = env.TZ || TZ_DEFAULT;
  const now = new Date().toISOString();
  const street = clean(d.street);
  const city = clean(d.city), state = clean(d.state), zip = clean(d.zip);
  let address = clean(d.address);
  if (!address) address = [street, city, [state, zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const first = clean(d.contact_first_name), last = clean(d.contact_last_name);
  const contact = clean(d.contact_name) || [first, last].filter(Boolean).join(' ');
  const items = splitList(d.line_items);
  const start = parseDate(d.started_at) || parseDate(d.start);
  const end = parseDate(d.completed_at) || parseDate(d.end);
  const sStart = parseDate(d.start) || start, sEnd = parseDate(d.end) || end;
  const cats = guessCategories(items.join(' ') + ' ' + clean(d.notes));
  return {
    id: crypto.randomUUID(),
    status: 'pending',
    created: now, updated: now, approved_at: null,
    source: d && Object.keys(d).length ? 'hcp' : 'manual',
    job_id: clean(d.job_id), job_number: clean(d.job_number),
    email_to: splitEmails(d.email).join('; '),
    client: up(clean(d.client)),
    address: up(address),
    street: street || address.split(',')[0] || '',
    city,
    onsite_contact: up(contact),
    contact_first: first || contact.split(' ')[0] || '',
    service_dates: dateRange(sStart, sEnd, tz),
    times: timeRange(start, end, tz),
    date_start: sStart ? ymd(sStart, tz) : '', date_end: sEnd ? ymd(sEnd, tz) : '',
    time_start: start ? hm24(start, tz) : '', time_end: end ? hm24(end, tz) : '',
    crew_lead: clean(d.crew_lead) || env.DEFAULT_CREW_LEAD || 'RIGO',
    weather: 'N/A',
    categories: cats,
    other_text: cats.other ? otherText(items) : '',
    work: items.length ? items.map(up) : [],
    observations: ['NO ISSUE FOUND'],
    recommendations: ['NONE'],
    photos: [],
    notes_internal: clean(d.notes),
    employees: clean(d.employees),
    email_subject: '', email_body: '',
    pdf: null,
    _weather_query: city ? { city, state, start: sStart, end: sEnd, tz } : null,
    raw: d,
  };
}

const EDITABLE = ['job_number', 'email_to', 'client', 'address', 'onsite_contact', 'contact_first', 'service_dates', 'times',
  'date_start', 'date_end', 'time_start', 'time_end',
  'crew_lead', 'weather', 'other_text', 'email_subject', 'email_body', 'street'];

function applyEdits(r, b) {
  for (const k of EDITABLE) if (k in b) r[k] = String(b[k] ?? '').slice(0, 5000);
  for (const k of ['work', 'observations', 'recommendations']) if (Array.isArray(b[k])) r[k] = b[k].map(s => String(s).slice(0, 2000)).filter(s => s.trim());
  if (b.categories && typeof b.categories === 'object') {
    r.categories = { window: !!b.categories.window, pressure: !!b.categories.pressure, detail: !!b.categories.detail, high_access: !!b.categories.high_access, other: !!b.categories.other };
  }
  if (Array.isArray(b.photos)) {
    const caps = new Map(b.photos.map(ph => [ph.id, String(ph.caption || '').slice(0, 300)]));
    const order = b.photos.map(ph => ph.id);
    r.photos = (r.photos || []).map(ph => ({ ...ph, caption: caps.has(ph.id) ? caps.get(ph.id) : ph.caption }))
      .sort((a, c) => order.indexOf(a.id) - order.indexOf(c.id));
  }
}

// ---------------------------------------------------------------- photos / approve
function buildEmail(r, env) {
  const sig = (env.SIGNATURE || DEFAULT_SIGNATURE).replace(/\\n/g, '\n');
  const addr = titleAddress(r.address);
  const subject = r.email_subject || DEFAULT_SUBJECT;
  const first = (r.contact_first || '').trim();
  const body = r.email_body || [
    `Hi ${first ? cap(first) : 'there'},`, '',
    DEFAULT_MESSAGE, '',
    'Best regards,', '', sig,
  ].join('\n');
  const body_html = body.split('\n').map(escHtml).join('<br>');
  return { subject, body, body_html };
}

const SUFFIX = { STREET: 'ST', AVENUE: 'AVE', BOULEVARD: 'BLVD', DRIVE: 'DR', ROAD: 'RD', LANE: 'LN', COURT: 'CT', PLACE: 'PL', PARKWAY: 'PKWY', HIGHWAY: 'HWY', CIRCLE: 'CIR', SUITE: 'STE', NORTH: 'N', SOUTH: 'S', EAST: 'E', WEST: 'W' };
function addrKey(a) {
  const first = String(a || '').toUpperCase().split(',')[0].replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!/^\d/.test(first)) return '';
  return first.split(' ').map(w => SUFFIX[w] || w).join(' ');
}
const COPY_FIELDS = ['client', 'email_to', 'onsite_contact', 'contact_first', 'other_text', 'crew_lead'];
function copyInto(dst, src) {
  for (const k of COPY_FIELDS) if (src[k]) dst[k] = src[k];
  dst.categories = { ...(src.categories || {}) };
  dst.work = [...(src.work || [])];
  dst.recommendations = (src.recommendations && src.recommendations.length) ? [...src.recommendations] : ['NONE'];
  dst.observations = ['NO ISSUE FOUND'];
  dst.copied_from = src.id;
}
async function lookupWeather(q) {
  if (!q || !q.start) return '';
  const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&country_code=US&name=${encodeURIComponent(q.city)}`).then(r => r.json());
  const loc = g && g.results && g.results[0];
  if (!loc) return '';
  const d1 = ymd(q.start, q.tz), d2 = ymd(q.end || q.start, q.tz);
  const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weather_code,temperature_2m_max&temperature_unit=fahrenheit&timezone=${encodeURIComponent(q.tz)}&start_date=${d1}&end_date=${d2}`).then(r => r.json());
  if (!w || !w.daily || !w.daily.weather_code) return '';
  return summarizeWeather(w.daily.weather_code, w.daily.temperature_2m_max);
}
function summarizeWeather(codes, temps) {
  const name = c => c === 0 ? 'CLEAR' : c <= 2 ? 'PARTLY CLOUDY' : c === 3 ? 'CLOUDY' : c <= 48 ? 'FOG' : c <= 57 ? 'DRIZZLE' : c <= 67 ? 'RAIN' : c <= 77 ? 'SNOW' : c <= 82 ? 'RAIN SHOWERS' : c <= 86 ? 'SNOW SHOWERS' : 'THUNDERSTORMS';
  const names = [...new Set(codes.map(name))];
  const t = temps.filter(x => typeof x === 'number');
  const hi = t.length ? Math.round(Math.max(...t)) : null, lo = t.length ? Math.round(Math.min(...t)) : null;
  const temp = hi === null ? '' : (hi === lo ? `, HIGH ${hi}°F` : `, HIGHS ${lo}–${hi}°F`);
  return names.join(' / ') + temp;
}

// ---------------------------------------------------------------- helpers

function guessCategories(text) {
  const t = (text || '').toLowerCase();
  const window = /window|glass|skylight|curtain ?wall/.test(t);
  const pressure = /pressure|power ?wash|soft ?wash|steam|sidewalk|garage|graffiti|parking/.test(t);
  const detail = /detail|mullion|frame|metal panel|awning|canopy|signage|facade|façade/.test(t);
  const high = /lift|swing|stage|boom|bosun|rope|scaffold|high[- ]?access|davit/.test(t);
  const other = /solar|gutter|light|janitor|decor|pigeon|bird|screen/.test(t) || !(window || pressure || detail || high);
  return { window, pressure, detail, high_access: high, other: other && !!t.trim() };
}
function otherText(items) {
  const o = items.filter(s => /solar|gutter|light|janitor|decor|pigeon|bird|screen/i.test(s));
  return up((o.length ? o : items).slice(0, 3).join(', '));
}
function splitList(v) {
  if (Array.isArray(v)) return v.map(clean).filter(Boolean);
  const s = clean(v);
  if (!s) return [];
  const parts = /\n/.test(s) ? s.split(/\r?\n/) : s.split(/\s*[,;|]\s*(?=[A-Za-z])/);
  return [...new Set(parts.map(x => x.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean))];
}
function splitEmails(v) {
  const s = Array.isArray(v) ? v.join(',') : clean(v);
  return [...new Set((s.match(/[^\s,;<>"']+@[^\s,;<>"']+\.[A-Za-z]{2,}/g) || []).map(x => x.trim()))];
}
function parseDate(v) {
  const s = clean(v);
  if (!s) return null;
  let d = new Date(s);
  if (isNaN(d) && /^\d+$/.test(s)) d = new Date(Number(s) * (s.length <= 10 ? 1000 : 1));
  return isNaN(d) ? null : d.toISOString();
}
function parts(iso, tz) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
  const o = {}; for (const p of f.formatToParts(new Date(iso))) o[p.type] = p.value;
  return o;
}
function ymd(iso, tz) { const o = parts(iso, tz); return `${o.year}-${String(o.month).padStart(2, '0')}-${String(o.day).padStart(2, '0')}`; }
function mdy(iso, tz) { const o = parts(iso, tz); return `${o.month}/${o.day}/${o.year}`; }
function hm24(iso, tz) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const o = {}; for (const p of f.formatToParts(new Date(iso))) o[p.type] = p.value;
  return `${String(o.hour).padStart(2, '0')}:${o.minute}`;
}
function hm(iso, tz) { const o = parts(iso, tz); return `${o.hour}:${o.minute}${(o.dayPeriod || '').toUpperCase()}`; }
function dateRange(a, b, tz) {
  if (!a && !b) return '';
  const x = mdy(a || b, tz), y = mdy(b || a, tz);
  return x === y ? x : `${x} – ${y}`;
}
function timeRange(a, b, tz) {
  if (!a && !b) return '';
  if (a && b) return `${hm(a, tz)} – ${hm(b, tz)}`;
  return hm(a || b, tz);
}
function reportFileName(r, tz) {
  const o = parts(new Date().toISOString(), tz);
  const street = String(r.street || r.address || '').split(',')[0].trim();
  const nice = titleAddress(street).replace(/[\\/:*?"<>|#%&{}~]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);
  return `SR ${o.month}-${o.day}-${o.year}${nice ? ' - ' + nice : ''}.pdf`;
}
function titleAddress(s) {
  return String(s || '').toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase())
    .replace(/\b(Ca|Ny|Nv|Az|Or|Wa|Tx)\b/g, x => x.toUpperCase())
    .replace(/\b(Ne|Nw|Se|Sw)\b/g, x => x.toUpperCase());
}
function randomToken() { const b = new Uint8Array(20); crypto.getRandomValues(b); return [...b].map(x => x.toString(16).padStart(2, '0')).join(''); }
function clean(v) { return v === undefined || v === null || v === 'undefined' || v === 'null' ? '' : String(v).trim(); }
function up(s) { return String(s || '').toUpperCase(); }
function cap(s) { s = String(s).toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  return { clean, up, cap, escHtml, parts, ymd, mdy, hm, hm24, dateRange, timeRange, parseDate, splitList, splitEmails, guessCategories, otherText,
           titleAddress, reportFileName, addrKey, copyInto, newReport, applyEdits, buildEmail, lookupWeather, TZ_DEFAULT, DEFAULT_SUBJECT, DEFAULT_MESSAGE, DEFAULT_SIGNATURE };
})();

// ===== CRM connection: same screens, the CRM's login and database underneath =====
const CFG = window.PFBS_CONFIG || {};
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const BUCKET = 'job-reports';
const ENV = { TZ: 'America/Los_Angeles', DEFAULT_CREW_LEAD: 'RIGO' };
const FALLBACK_TECHS = ['Rigo Perez', 'Baldemar Cervantes', 'Rolando Olivera', 'Israel Hernandez'];
const MANAGERS = ['Owner', 'Admin', 'Senior Estimator'];
let ME = null, PH_URL = {};

class ApiError extends Error {}
const fail = msg => { throw new ApiError(msg); };
const ok = (res) => { if (res.error) fail(/relation|schema|function/i.test(res.error.message) ? 'Run database update 017 in Supabase to turn on service reports.' : res.error.message); return res.data; };

async function ensureMe() {
  if (ME) return ME;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = './?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search + location.hash); throw new ApiError('login'); }
  if (window.MFA) { try { await MFA.gate(sb); } catch (e) { console.warn('2-step check', e); } }
  const email = (session.user.email || '').toLowerCase();
  const { data: m } = await sb.from('team_members').select('*').eq('email', email).eq('active', true).maybeSingle();
  if (!m || !MANAGERS.includes(m.role)) { document.body.innerHTML = `<main style="padding:40px;font:16px system-ui">Service reports are for the office. <a href="./">Back to the CRM</a></main>`; throw new ApiError('login'); }
  ME = m; return ME;
}

// a row from the database → the report object the screens use
function fromRow(row) {
  const r = { ...(row.doc || {}) };
  r.id = row.id; r.status = row.status; r.approved_at = row.approved_at; r.num = row.num || null; r.hcp_job = row.hcp_job || '';
  r.created = r.created || row.created_at; r.updated = row.updated_at;
  return r;
}
async function saveRow(r) {
  const doc = { ...r }; for (const k of ['status', 'approved_at', 'num', 'hcp_job', '_raw']) delete doc[k];
  if (doc.pdf) doc.pdf = { path: doc.pdf.path, file_name: doc.pdf.file_name };

async function fillFromJob(r, num) {

  if (!r.job_number && p.hcp_job) r.job_number = p.hcp_job;

  const items = p.items || [], groups = [...new Set(items.filter(i => i.type !== 'Add-on' && i.group).map(i => i.group))];

async function normalize(row) {
  const raw = row.doc && row.doc._raw;

  // HousecallPro's trigger sends no dates: the Zap fires when the job is finished, so that day is the service date
  const noDates = !raw.start && !raw.end && !raw.started_at && !raw.completed_at;
  const r = SRV.newReport(noDates ? { ...raw, started_at: row.created_at, completed_at: row.created_at } : raw, ENV); r.id = row.id; r.status = row.status; r.num = row.num;
  if (noDates) { r.times = ''; r.time_start = ''; r.time_end = ''; }

  try { r.weather = (await SRV.lookupWeather(q)) || 'N/A'; } catch (_) { r.weather = 'N/A'; }
  if (row.num) await fillFromJob(r, row.num);

    }

    if ((mm = path.match(/^\/api\/reports\/([a-z0-9-]+)$/))) {

      if (m === 'DELETE') {

      await saveRow(r); await signPhotos(r); return r;
    }
    if (m === 'DELETE' && (mm = path.match(/^\/api\/reports\/([a-z0-9-]+)\/photos\/([a-z0-9-]+)$/))) {
      const r = await getReport(mm[1]); r.photos = (r.photos || []).filter(ph => ph.id !== mm[2]);
      await sb.storage.from(BUCKET).remove([`photos/${r.id}/${mm[2]}.jpg`]); await saveRow(r); return r;
    }
    if (m === 'GET' && (mm = path.match(/^\/api\/reports\/([a-z0-9-]+)\/previous$/))) {
      const r = await getReport(mm[1]); const key = SRV.addrKey(r.street || r.address); if (!key) return { previous: null };
      const rows = ok(await sb.from('service_reports').select('id,status,service_dates,approved_at,created_at').eq('addr_key', key).neq('id', r.id));
      let best = null; for (const x of rows) { const c = { id: x.id, status: x.status, service_dates: x.service_dates || '', when: x.approved_at || x.created_at || '' };
        if (!best || (c.status === 'approved') > (best.status === 'approved') || ((c.status === 'approved') === (best.status === 'approved') && c.when > best.when)) best = c; }
      return { previous: best };
    }

      const r = await getReport(mm[1]), src = await getReport(mm[2]); SRV.copyInto(r, src); await saveRow(r); return r;

function queueSave(delay = 900) {
  state.dirty = true; const s = $('#saved'); if (s) s.textContent = 'Saving…';
  clearTimeout(state.saveTimer); state.saveTimer = setTimeout(flushSave, delay);
}
async function flushSave() {
  clearTimeout(state.saveTimer);
  if (state.saving) await state.saving;
  if (!state.dirty || !state.report) return;
  state.dirty = false;
  const r = state.report;
  const body = {}; for (const k of ['job_number', 'email_to', 'client', 'address', 'onsite_contact', 'contact_first', 'service_dates', 'times', 'date_start', 'date_end', 'time_start', 'time_end', 'crew_lead', 'weather', 'other_text', 'email_subject', 'email_body', 'work', 'observations', 'recommendations', 'categories']) body[k] = r[k];
  body.photos = (r.photos || []).map(p => ({ id: p.id, caption: p.caption }));
  state.saving = api('/api/reports/' + r.id, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(saved => { if (state.report && state.report.id === saved.id) { state.report.updated = saved.updated; state.report.photos = saved.photos.map(p => ({ ...p, caption: (r.photos.find(x => x.id === p.id) || p).caption })); } const s = $('#saved'); if (s && !state.dirty) s.textContent = 'Saved'; })
    .catch(e => { state.dirty = true; const s = $('#saved'); if (s) s.textContent = 'Not saved'; if (e.message !== 'login') toast('Could not save: ' + e.message); })
    .finally(() => { state.saving = null; });
  await state.saving;
}
window.addEventListener('beforeunload', e => { if (state.dirty) { flushSave(); e.preventDefault(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

function uploadPhotos(files) {
  const job = doUpload(files).finally(() => { if (state.uploading === job) state.uploading = null; });
  state.uploading = job; return job;
}
async function waitUploads() {
  if (!state.uploading) return;
  toast('Waiting for photos to finish uploading…', 2000);
  await state.uploading;
}
async function doUpload(files) {
  const r = state.report; if (!files.length) return;
  await flushSave();
  const hint = $('#uphint');
  let n = 0;
  for (const f of files) {
    n++; if (hint) hint.innerHTML = `<span class="spin"></span>Uploading ${n} of ${files.length}…`;
    try {
      const { blob, w, h } = await shrink(f);
      state.report = await api(`/api/reports/${r.id}/photos`, { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-width': w, 'x-height': h }, body: blob });
    } catch (e) { if (e.message === 'login') return; toast(`Could not add ${f.name}: ${e.message}`, 4000); }
  }
  showReport(r.id);
}
function shrink(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve({ blob: b, w, h }) : reject(new Error('could not read photo')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not a supported image')); };
    img.src = url;
  });
}

    const { data: K } = await sb.from('client_contacts').select('id,email,active').in('id', ids);

async function approveFlow() {
  await waitUploads();
  const r = state.report;
  await flushSave();
  const emails = (r.email_to || '').match(/[^\s,;]+@[^\s,;]+\.[A-Za-z]{2,}/g) || [];
  const warns = [];
  if (!emails.length) warns.push('There is no client email. The email will have no recipient yet.');
  if (!(r.photos || []).length) warns.push('No photos have been added.');
  if (!(r.work || []).length) warns.push('Work Performed is empty.');
  const ok = await dialog(`<h3>Approve this report?</h3><p>This creates the PDF, downloads it, and opens an email${emails.length ? ` to <b>${esc(emails.join(', '))}</b>` : ''}. Attach the PDF and send.</p>${warns.map(w => `<p class="warn">⚠ ${esc(w)}</p>`).join('')}`, 'Approve');
  if (!ok) return;
  const btn = $('#approve'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Creating PDF…';

const asc = s => String(s ?? '').replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '');
async function toDataUrl(src) {
  const res = await fetch(src); if (!res.ok) throw new Error('photo missing');
  const blob = await res.blob();
  const dataUrl = await new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = bad; fr.readAsDataURL(blob); });
  const dims = await new Promise(ok => { const i = new Image(); i.onload = () => ok({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => ok({ w: 4, h: 3 }); i.src = dataUrl; });
  return { dataUrl, ...dims };
}

async function buildPdf(r) {
  if (!window.jspdf) throw new Error('PDF library did not load — check your internet connection');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  doc.setProperties({ title: `Service Report ${r.job_number ? '#' + r.job_number : ''}`.trim(), author: 'PF Building Services', creator: 'PFBS Service Reports' });
  const L = 72, R = 540, W = R - L, BOTTOM = 728;
  const BLUE = [79, 129, 189], LINK = [5, 99, 193];
  let y = 0;
  const logo = await toDataUrl('reports-logo.jpg');
  const photos = [];
  let failed = 0;
  for (const ph of r.photos || []) {
    try { photos.push({ ...(await toDataUrl(await photoSrc(r, ph))), caption: ph.caption }); }
    catch (e) { failed++; photos.push({ missing: true, caption: ph.caption }); console.error('photo', ph.id, e); }
  }
  if (failed) toast(`${failed} photo(s) could not be loaded into the PDF. Try again, or remove and re-add them.`, 6000);

  const font = (style = 'normal', size = 10.5, fam = 'times') => { doc.setFont(fam, style); doc.setFontSize(size); };
  const color = c => doc.setTextColor(...c);
  const newPage = () => { doc.addPage(); y = 72; };
  const ensure = h => { if (y + h > BOTTOM) newPage(); };
  const heading = t => { ensure(44); y += 22; font('bold', 12.5, 'helvetica'); color(BLUE); doc.text(t, L, y); color([0, 0, 0]); y += 8; };
  const para = (t, style = 'normal', size = 10.5) => { font(style, size); const lines = doc.splitTextToSize(asc(t), W); ensure(lines.length * 13 + 4); y += 13; doc.text(lines, L, y); y += (lines.length - 1) * 13; };
  const numbered = items => {
    font('normal', 10.5);
    const list = items && items.length ? items : [''];
    list.forEach((it, i) => {
      const lines = doc.splitTextToSize(asc(it), W - 36);
      ensure(lines.length * 13 + 4); y += 15;
      doc.text(`${i + 1}.`, L + 18, y); doc.text(lines, L + 36, y); y += (lines.length - 1) * 13;
    });
  };
  const table = rows => {
    const mid = L + W / 2; font('normal', 10.5);
    rows.forEach(([k, v]) => {
      const lines = doc.splitTextToSize(asc(v), W / 2 - 10);
      const h = Math.max(22, lines.length * 13 + 9);
      ensure(h);
      doc.setDrawColor(0); doc.setLineWidth(0.6);
      doc.text(asc(k), L + 4, y + 14); doc.text(lines, mid + 6, y + 14);
      doc.line(L, y + h, R, y + h); doc.line(mid, y, mid, y + h);
      y += h;
    });
  };
  const box = (x, yy, on) => {
    doc.setDrawColor(0); doc.setLineWidth(0.7); doc.rect(x, yy - 8.5, 9, 9);
    if (on) { doc.setLineWidth(1.3); doc.line(x + 1.8, yy - 4.2, x + 3.9, yy - 1.6); doc.line(x + 3.9, yy - 1.6, x + 7.6, yy - 7); }
  };

  // ---- header block
  y = 70; font('bold', 18); doc.text('SERVICE REPORT', 306, y, { align: 'center' });
  y += 20; font('bold', 9.5);
  const a = '(510)359-5181 | INFO@PFBUILDINGSERVICES.COM | ', b = 'WWW.PFBSERVICES.COM';
  const wa = doc.getTextWidth(a), wb = doc.getTextWidth(b), x0 = 306 - (wa + wb) / 2;
  doc.text(a, x0, y); color(LINK); doc.textWithLink(b, x0 + wa, y, { url: 'https://www.pfbservices.com' }); doc.setDrawColor(...LINK); doc.setLineWidth(0.5); doc.line(x0 + wa, y + 1.5, x0 + wa + wb, y + 1.5); color([0, 0, 0]);
  const lw = 331, lh = lw * logo.h / logo.w;
  y += 12; doc.addImage(logo.dataUrl, 'JPEG', 306 - lw / 2, y, lw, lh); y += lh + 14;
  doc.setDrawColor(0); doc.setLineWidth(0.8); doc.line(L, y, R, y); doc.line(L, y + 2.5, R, y + 2.5); y += 18;
  font('bold', 10.5); doc.text('EMAIL TO:', L, y);
  const emails = asc(r.email_to || '').split(/[;,]\s*/).filter(Boolean).join('; ');
  if (emails) { font('normal', 10.5); color(LINK); const el = doc.splitTextToSize(emails, W - 64); doc.text(el, L + 62, y); y += (el.length - 1) * 13; color([0, 0, 0]); }

  heading('PROPERTY DETAILS');
  table([['Client / Management Company:', r.client], ['Job Number:', r.job_number], ['Property Address:', r.address], ['On-Site Contact:', r.onsite_contact]]);
  y += 6;
  heading('SERVICE SUMMARY');
  table([['Service Date:', r.service_dates], ['Arrival Time / Completion Time:', r.times], ['Crew Lead:', r.crew_lead], ['Weather Conditions:', r.weather || 'N/A']]);

  ensure(110); y += 24; font('bold', 10.5); doc.text('Service Category (check all that apply):', L, y);
  const c = r.categories || {};
  [['window', 'Window Cleaning'], ['pressure', 'Pressure Washing'], ['detail', 'Exterior Detail Cleaning'], ['high_access', 'High-Access Work (Lift / Swing Stage)'], ['other', 'Other:']].forEach(([k, l]) => {
    ensure(18); y += 17; box(L, y, !!c[k]); font('normal', 10.5); doc.text(l, L + 15, y);
    if (k === 'other' && r.other_text) doc.text(asc(r.other_text), L + 15 + doc.getTextWidth(l) + 4, y);
  });

  heading('WORK PERFORMED'); para('Provide a detailed description of services completed:'); numbered(r.work);
  heading('SITE CONDITIONS & OBSERVATIONS'); para('(Access limitations, pre-existing damage, compliance issues, etc.)'); numbered(r.observations);
  ensure(24); y += 22; font('normal', 10.5); doc.text(`Photos Attached: ${photos.some(p => !p.missing) ? 'YES' : 'NO'}`, L, y);
  heading('RECOMMENDATIONS / ACTION ITEMS'); numbered(r.recommendations);

  if (photos.length) {
    heading('JOB PHOTOS'); y += 6;
    const gap = 12, cw = (W - gap) / 2, ch = cw * 0.75;
    for (let i = 0; i < photos.length; i += 2) {
      const pair = photos.slice(i, i + 2);
      const capH = Math.max(...pair.map(p => p.caption ? doc.splitTextToSize(asc(p.caption), cw).length * 11 + 4 : 0));
      ensure(ch + capH + 12);
      pair.forEach((p, j) => {
        const x = L + j * (cw + gap);
        if (p.missing) { doc.setDrawColor(170); doc.setLineWidth(0.6); doc.rect(x, y, cw, ch); font('italic', 10); color([130, 130, 130]); doc.text('Photo could not be loaded', x + cw / 2, y + ch / 2, { align: 'center' }); color([0, 0, 0]); }
        else {
          const s = Math.min(cw / p.w, ch / p.h), iw = p.w * s, ih = p.h * s;
          doc.addImage(p.dataUrl, 'JPEG', x + (cw - iw) / 2, y + (ch - ih) / 2, iw, ih, undefined, 'FAST');
        }
        if (p.caption) { font('italic', 9.5); doc.text(doc.splitTextToSize(asc(p.caption), cw), x + cw / 2, y + ch + 12, { align: 'center' }); }
      });
      y += ch + capH + 12;
    }
  }

  // ---- header/footer on every page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    font('normal', 9); color([0, 0, 0]); doc.text('PF BUILDING SERVICES', R, 40, { align: 'right' });
    doc.setDrawColor(0); doc.setLineWidth(0.8); doc.line(L, 742, R, 742); doc.line(L, 744.5, R, 744.5);
    font('normal', 9.5); doc.text('PF Building Services | Professional Exterior Maintenance | Licensed & Insured', 306, 760, { align: 'center' });
    if (n > 1) { font('normal', 8.5); color([110, 110, 110]); doc.text(`Page ${i} of ${n}`, R, 760, { align: 'right' }); color([0, 0, 0]); }
  }
  return doc.output('blob');
}

// ---------------------------------------------------------------- boot
(async () => {
  try { await api('/api/me'); const num = new URLSearchParams(location.search).get('num'); if (num) await openForJob(num.toUpperCase()); render(); }
  catch (e) { if (e.message !== 'login') app.innerHTML = `<main><div class="card">Something went wrong: ${esc(e.message)}</div></main>`; }
})();
</script>
</body>
</html>
